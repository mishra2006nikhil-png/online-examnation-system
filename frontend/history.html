<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Result History</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            padding: 40px 15px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #0f172a;
            margin-bottom: 8px;
        }

        .student {
            color: #64748b;
            font-size: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 15px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #eff6ff;
        }

        .percentage {
            font-weight: bold;
            color: #16a34a;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #dcfce7;
            color: #15803d;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        .back {
            display: block;
            width: 180px;
            margin: 30px auto 0;
            padding: 13px;
            text-align: center;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .back:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {

            .container {
                padding: 20px;
                overflow-x: auto;
            }

            table {
                min-width: 700px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 Result History</h1>

        <div class="student">
            Student:
            <strong id="studentName">Student</strong>
        </div>
    </div>

    <table>

        <thead>
            <tr>
                <th>Exam ID</th>
                <th>Score</th>
                <th>Total</th>
                <th>Percentage</th>
                <th>Status</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody id="resultsTable"></tbody>

    </table>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>


<script>

const studentId = localStorage.getItem("student_id");

const studentName = localStorage.getItem("student_name");

if (studentName) {
    document.getElementById("studentName").textContent =
        studentName;
}


if (!studentId) {

    document.getElementById("resultsTable").innerHTML = `
        <tr>
            <td colspan="6" class="empty">
                Please login first.
            </td>
        </tr>
    `;

} else {

    fetch(
        "/results?student_id=" +
        studentId
    )

    .then(response => {

        if (!response.ok) {
            throw new Error("Failed to load results");
        }

        return response.json();

    })

    .then(results => {

        const table =
            document.getElementById("resultsTable");

        if (results.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="6" class="empty">
                        No exam results found.
                    </td>
                </tr>
            `;

            return;
        }


        results.forEach(result => {

            const percentage =
                Number(result.percentage).toFixed(2);

            const status =
                percentage >= 40
                    ? "PASS"
                    : "FAIL";

            const row = `

                <tr>

                    <td>${result.exam_id}</td>

                    <td>
                        ${result.score}
                    </td>

                    <td>
                        ${result.total_questions}
                    </td>

                    <td class="percentage">
                        ${percentage}%
                    </td>

                    <td>
                        <span class="status">
                            ${status}
                        </span>
                    </td>

                    <td>
                        ${new Date(
                            result.submitted_at
                        ).toLocaleString()}
                    </td>

                </tr>

            `;

            table.innerHTML += row;

        });

    })

    .catch(error => {

        console.error(
            "Error loading results:",
            error
        );

        document.getElementById("resultsTable").innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    Results load nahi ho pa rahe hain.
                </td>
            </tr>
        `;

    });

}

</script>

</body>
</html>
