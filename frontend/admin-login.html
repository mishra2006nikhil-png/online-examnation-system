<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .icon {
            text-align: center;
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #334155;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
        }

        .back:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="icon">
        🔐
    </div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        Online Examination System
    </p>

    <form id="adminLoginForm">

        <label for="email">
            Admin Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button
            type="submit"
            class="login-btn"
        >
            Login to Dashboard →
        </button>

    </form>

    <a href="index.html" class="back">
        ← Back to Student Login
    </a>

</div>


<script>

document
    .getElementById("adminLoginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        try {

            const response =
                await fetch(
                    "http://localhost:5000/admin-login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                alert(
                    data.message ||
                    "Invalid admin credentials"
                );

                return;
            }


            // Save admin login status

            localStorage.setItem(
                "admin_logged_in",
                "true"
            );


            alert(
                "Admin login successful!"
            );


            window.location.href =
                "admin.html";

        }

        catch (error) {

            console.error(
                "Admin login error:",
                error
            );

            alert(
                "Server se connection nahi ho raha."
            );

        }

    });

</script>

</body>

</html>
