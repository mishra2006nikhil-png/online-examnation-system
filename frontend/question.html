<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .form-card h2 {
            margin-bottom: 20px;
            color: #2563eb;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 15px;
            outline: none;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2563eb;
        }

        .add-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .questions-section h2 {
            margin-bottom: 20px;
        }

        .question-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            background: white;
        }

        .question-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .options {
            color: #475569;
            line-height: 1.8;
        }

        .correct {
            color: #16a34a;
            font-weight: bold;
        }

        .delete-btn {
            margin-top: 15px;
            padding: 9px 15px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .back {
            display: block;
            width: 170px;
            margin: 30px auto 0;
            padding: 12px;
            text-align: center;
            background: #64748b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📝 Question Management</h1>

    <p class="subtitle">
        Add and manage examination questions
    </p>


    <!-- ADD QUESTION -->

    <div class="form-card">

        <h2>➕ Add New Question</h2>

        <form id="questionForm">

            <label>Exam ID</label>

            <input
                type="number"
                id="exam_id"
                value="1"
                required
            >


            <label>Question</label>

            <textarea
                id="question"
                placeholder="Enter question"
                required
            ></textarea>


            <label>Option A</label>

            <input
                type="text"
                id="option_a"
                placeholder="Enter option A"
                required
            >


            <label>Option B</label>

            <input
                type="text"
                id="option_b"
                placeholder="Enter option B"
                required
            >


            <label>Option C</label>

            <input
                type="text"
                id="option_c"
                placeholder="Enter option C"
                required
            >


            <label>Option D</label>

            <input
                type="text"
                id="option_d"
                placeholder="Enter option D"
                required
            >


            <label>Correct Option</label>

            <select id="correct_option" required>

                <option value="">Select correct option</option>

                <option value="A">Option A</option>

                <option value="B">Option B</option>

                <option value="C">Option C</option>

                <option value="D">Option D</option>

            </select>


            <button
                type="submit"
                class="add-btn"
            >
                Add Question
            </button>

        </form>

    </div>


    <!-- QUESTIONS -->

    <div class="questions-section">

        <h2>📋 Existing Questions</h2>

        <div id="questionsList">
            <div class="empty">
                Loading questions...
            </div>
        </div>

    </div>


    <a href="admin.html" class="back">
        ← Back to Admin Panel
    </a>

</div>


<script>

const API = "";


// =========================
// ADD QUESTION
// =========================

document.getElementById("questionForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const questionData = {

        exam_id:
            Number(document.getElementById("exam_id").value),

        question:
            document.getElementById("question").value.trim(),

        option_a:
            document.getElementById("option_a").value.trim(),

        option_b:
            document.getElementById("option_b").value.trim(),

        option_c:
            document.getElementById("option_c").value.trim(),

        option_d:
            document.getElementById("option_d").value.trim(),

        correct_option:
            document.getElementById("correct_option").value

    };


    try {

        const response = await fetch(
            API + "/questions",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(questionData)
            }
        );


        const data = await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Question add nahi hua."
            );

            return;
        }


        alert("✅ Question added successfully!");


        document.getElementById("questionForm").reset();

        document.getElementById("exam_id").value = 1;


        loadQuestions();

    }

    catch (error) {

        console.error(
            "Question add error:",
            error
        );

        alert(
            "Server se connection nahi ho raha."
        );
    }

});


// =========================
// LOAD QUESTIONS
// =========================

async function loadQuestions() {

    const list =
        document.getElementById("questionsList");


    try {

        const response =
            await fetch(API + "/questions");


        const questions =
            await response.json();


        if (!response.ok) {

            throw new Error(
                "Questions load failed"
            );
        }


        list.innerHTML = "";


        if (questions.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    No questions available.
                </div>
            `;

            return;
        }


        questions.forEach(function(q, index) {

            const correctAnswer =
                q.correct_option;


            const card = document.createElement("div");

            card.className = "question-card";


            card.innerHTML = `

                <div class="question-title">
                    Q${index + 1}. ${q.question}
                </div>

                <div class="options">

                    <div>
                        A. ${q.option_a}
                    </div>

                    <div>
                        B. ${q.option_b}
                    </div>

                    <div>
                        C. ${q.option_c}
                    </div>

                    <div>
                        D. ${q.option_d}
                    </div>

                    <div class="correct">
                        ✅ Correct Answer:
                        ${correctAnswer}
                    </div>

                </div>

                <button
                    class="delete-btn"
                    onclick="deleteQuestion(${q.id})"
                >
                    🗑️ Delete
                </button>

            `;


            list.appendChild(card);

        });

    }

    catch (error) {

        console.error(
            "Questions load error:",
            error
        );


        list.innerHTML = `
            <div class="empty">
                ❌ Questions load nahi ho rahe.
            </div>
        `;
    }

}


// =========================
// DELETE QUESTION
// =========================

async function deleteQuestion(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this question?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(
                API + "/questions/" + id,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Question delete nahi hua."
            );

            return;
        }


        alert(
            "✅ Question deleted successfully!"
        );


        loadQuestions();

    }

    catch (error) {

        console.error(
            "Delete error:",
            error
        );

        alert(
            "Server se connection nahi ho raha."
        );
    }

}


// =========================
// START
// =========================

loadQuestions();

</script>

</body>
</html>
